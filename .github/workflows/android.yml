name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  # GitHub-hosted runners ship an SDK under this path; AGP uses it via local.properties / env.
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Assemble ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Do NOT use android-actions/setup-android defaults — they still try to install the
      # removed `tools` package and fail sdkmanager. Point at the runner SDK and install
      # only what we need (platform 34 + build-tools).
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true

          # Prefer cmdline-tools from the runner image
          CMDLINE_TOOLS=""
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/cmdline-tools/latest/bin; do
            if [ -x "$d/sdkmanager" ]; then
              CMDLINE_TOOLS="$d"
              break
            fi
          done
          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "cmdline-tools not found; installing..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          fi

          export PATH="$CMDLINE_TOOLS:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # local.properties for Gradle (sdk.dir)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Installed packages:"
          sdkmanager --list_installed | head -40

      - name: Grant execute on gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK (unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: kojot-dyno-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: kojot-dyno-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  signed-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && vars.ENABLE_SIGNED_RELEASE == 'true'
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          CMDLINE_TOOLS=""
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/cmdline-tools/latest/bin; do
            if [ -x "$d/sdkmanager" ]; then CMDLINE_TOOLS="$d"; break; fi
          done
          if [ -z "$CMDLINE_TOOLS" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          export PATH="$CMDLINE_TOOLS:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: chmod +x gradlew
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
      - name: Assemble signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: kojot-dyno-release-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
